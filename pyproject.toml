[project]
name = "glamira-pipeline"
version = "0.1.0"
description = "Profiling, MongoDB loading, enrichment and Avro export of 41M Glamira tracking events"
readme = "README.md"
authors = [
    { name = "ducklemon596", email = "thienquang050906@gmai.com" }
]
requires-python = ">=3.10"
dependencies = [
    "fastavro>=1.12.2",
    "google-cloud-bigquery>=3.47.0",
    "google-cloud-storage>=3.17.1",
    "ip2location>=8.11.0",
    "pymongo>=4.18.3",
]

[project.scripts]
extract-sample = "glamira_pipeline.sampling.extract:main"
assess-data-quality = "glamira_pipeline.quality.cli:main"
seed-ip-sample = "glamira_pipeline.ip_location.cli:seed_main"
enrich-ip-locations = "glamira_pipeline.ip_location.cli:enrich_main"
list-product-ids = "glamira_pipeline.products.cli:list_ids_main"
crawl-products = "glamira_pipeline.products.cli:crawl_main"
setup-product-collections = "glamira_pipeline.products.cli:setup_collections_main"
load-summary = "glamira_pipeline.load.cli:load_main"
reconcile-summary = "glamira_pipeline.load.cli:reconcile_main"
profile-schema = "glamira_pipeline.profiling.cli:main"
export-avro = "glamira_pipeline.export.cli:export_main"
verify-export = "glamira_pipeline.export.cli:verify_main"
write-raw-schemas = "glamira_pipeline.export.cli:schemas_main"
publish-export = "glamira_pipeline.warehouse.cli:publish_main"

[build-system]
requires = ["uv_build>=0.13.6,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "functions-framework>=3.10.2",
]
