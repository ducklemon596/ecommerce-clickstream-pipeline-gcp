[project]
name = "glamira-pipeline"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "ducklemon596", email = "thienquang050906@gmai.com" }
]
requires-python = ">=3.10"
dependencies = [
    "ip2location>=8.11.0",
    "pymongo>=4.18.3",
]

[project.scripts]
extract-sample = "glamira_pipeline.sampling.extract:main"
assess-data-quality = "glamira_pipeline.quality.cli:main"
seed-ip-sample = "glamira_pipeline.ip_location.cli:seed_main"
enrich-ip-locations = "glamira_pipeline.ip_location.cli:enrich_main"
enrich-ip-locations-full = "glamira_pipeline.ip_location.cli:enrich_full_main"

[build-system]
requires = ["uv_build>=0.13.6,<0.14.0"]
build-backend = "uv_build"
